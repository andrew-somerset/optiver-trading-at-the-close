[project]
name = "optiver-trading-at-the-close"
version = "0.1.0"
description = "Closing-auction return prediction on the archived Optiver Kaggle dataset."
requires-python = ">=3.12"
dependencies = [
    "kaggle>=2.2.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/closing_auction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
